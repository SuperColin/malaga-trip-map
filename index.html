<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Málaga, October — Colin's Trip Map</title>
<meta name="description" content="A personal map of restaurants, bars, and sights in Málaga, recommended by our AirBNB host Antonio.">
<meta name="theme-color" content="#c1502e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="app">

  <!-- Intro / loading veil -->
  <div id="veil">
    <div class="veil-inner">
      <span class="veil-kicker">Málaga · October</span>
      <h1 class="veil-title">Antonio's Málaga</h1>
      <p class="veil-sub">Loading the map&hellip;</p>
    </div>
  </div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22" fill="none"><path d="M16 3c-6 0-11 5-11 11 0 8 11 15 11 15s11-7 11-15c0-6-5-11-11-11z" fill="var(--clay)"/><circle cx="16" cy="14" r="4" fill="var(--sand)"/></svg>
      </span>
      <div class="brand-text">
        <span class="brand-title">Antonio's Málaga</span>
        <span class="brand-sub">A host's tips, mapped</span>
      </div>
    </div>
    <button id="listToggle" class="icon-btn" aria-label="Show list view" aria-pressed="false">
      <span class="toggle-icon icon-list" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </span>
      <span class="toggle-icon icon-map" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </span>
    </button>
  </header>

  <nav id="filters" aria-label="Filter by category"></nav>

  <main id="map" role="application" aria-label="Map of recommended places in Málaga"></main>

  <!-- List view (mobile-friendly alternative to the map) -->
  <div id="listView" aria-hidden="true">
    <div id="listGrid"></div>
  </div>

  <!-- Hover / focus popover (desktop) -->
  <div id="popover" class="popover" hidden>
    <div class="popover-media"><img alt=""></div>
    <div class="popover-body">
      <span class="popover-cat"></span>
      <h3 class="popover-name"></h3>
      <p class="popover-desc"></p>
      <div class="popover-meta">
        <span class="popover-rating"></span>
        <span class="popover-price"></span>
      </div>
    </div>
  </div>

  <!-- Detail sidebar -->
  <aside id="sidebar" aria-hidden="true">
    <button id="sidebarClose" class="icon-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <div id="sidebarContent"></div>
  </aside>

  <div id="scrim" hidden></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
